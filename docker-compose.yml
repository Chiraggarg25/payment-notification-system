name: payment-notifications

# Spring Boot services: bounded memory (the JVM heap is 75% of mem_limit) and a healthcheck on
# /actuator/health so `docker compose ps` shows "healthy" only when the app is really up.
x-java-healthcheck: &java-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health > /dev/null || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 768m
  healthcheck: *java-healthcheck
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- infrastructure
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "29092:29092"          # for apps running on your host (localhost:29092)
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"   # default is 1 GB; keeps the whole stack light on laptops
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8085:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------- application
  mock-vendor-api:
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      args:
        MODULE: mock-vendor-api
    container_name: mock-vendor-api
    restart: unless-stopped
    mem_limit: 768m
    healthcheck: *java-healthcheck
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"

  platform-service:
    <<: *java-service
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      args:
        MODULE: platform-service
    container_name: platform-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  notification-service:
    <<: *java-service
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      args:
        MODULE: notification-service
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      MOCK_VENDOR_BASE_URL: http://mock-vendor-api:8090
      FIRST_SWEEP_DELAY: 10s

  sweeper-service:
    <<: *java-service
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      args:
        MODULE: sweeper-service
    container_name: sweeper-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      REDIS_HOST: redis
      MOCK_VENDOR_BASE_URL: http://mock-vendor-api:8090
      SWEEPER_MAX_ATTEMPTS: 5
      SWEEPER_BASE_DELAY: 10s
      SWEEPER_POLL_INTERVAL_MS: 5000

  ui:
    build: ./ui
    container_name: ui
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Only waits for the containers to exist: the UI comes up even if a backend is down,
    # and each card shows which service is unreachable.
    depends_on:
      - platform-service
      - notification-service
      - sweeper-service
      - mock-vendor-api

volumes:
  redis-data:
