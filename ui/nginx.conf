server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, resolved per request (not once at startup). nginx therefore starts and
    # serves the UI even while a backend container is still starting, restarting or down; that
    # backend's API calls just get a fast 502 instead of taking the whole UI down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;          # "Sweep now" can take up to the sweeper's 45s sweep-timeout

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # never cache the HTML shell, so a rebuilt UI shows up on the next reload
    location = /index.html { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri /index.html;
    }

    # /api/<service>/... -> service (prefix stripped by the rewrite, query string kept)
    location /api/platform/ {
        set $platform_upstream platform-service:8080;
        rewrite ^/api/platform/(.*)$ /$1 break;
        proxy_pass http://$platform_upstream;
    }
    location /api/notifier/ {
        set $notifier_upstream notification-service:8081;
        rewrite ^/api/notifier/(.*)$ /$1 break;
        proxy_pass http://$notifier_upstream;
    }
    location /api/sweeper/ {
        set $sweeper_upstream sweeper-service:8082;
        rewrite ^/api/sweeper/(.*)$ /$1 break;
        proxy_pass http://$sweeper_upstream;
    }
    location /api/vendor/ {
        set $vendor_upstream mock-vendor-api:8090;
        rewrite ^/api/vendor/(.*)$ /$1 break;
        proxy_pass http://$vendor_upstream;
    }
}
